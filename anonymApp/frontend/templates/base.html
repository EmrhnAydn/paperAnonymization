<!-- base.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Güvenli Belge Anonimleştirme Sistemi{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
        }
        .navbar {
            margin-bottom: 20px;
        }
        footer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: #999999;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('home') }}">AnonymApp</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('makale_yukle') }}">Makale Yükle</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('makale_sorgula') }}">Durum Sorgula</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('yonetici_paneli') }}">Yönetici Paneli</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('hakem_paneli') }}">Hakem Paneli</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Burada child template'lerden (ör. yonetici_paneli.html) gelen scripts bloğunu basıyoruz. -->
    {% block scripts %}{% endblock %}
</body>
</html>
